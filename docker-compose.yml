services:
  db:
    image: postgres:17

    container_name: flow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: flow_predictor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend

    container_name: flow-django

    restart: unless-stopped

    command: python manage.py runserver 0.0.0.0:8000

    volumes:
      - ./backend:/app

    ports:
      - "8000:8000"

    environment:
      POSTGRES_DB: flow_predictor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      - db

  frontend:
    build:
      context: ./frontend

    container_name: flow-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      - backend

volumes:
  postgres_data: